name: Deploy production backend

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_ID \
            RESEND_API_KEY \
            RESEND_FROM_EMAIL \
            VAPID_PUBLIC_KEY \
            VAPID_PRIVATE_KEY \
            VAPID_SUBJECT
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --yes --include-all

      - name: Configure notification worker secrets
        run: |
          supabase secrets set \
            RESEND_API_KEY="$RESEND_API_KEY" \
            RESEND_FROM_EMAIL="$RESEND_FROM_EMAIL" \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="$VAPID_SUBJECT"

      - name: Deploy notification worker
        run: supabase functions deploy notification-worker --no-verify-jwt
