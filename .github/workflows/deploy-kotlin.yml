name: Deploy Kotlin site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kotlin-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: kotlin-production
      url: https://forena-kotlin.vercel.app
    env:
      VERCEL_ORG_ID: team_hkR9c8WmDdaB7Ohge0pDlA6X
      VERCEL_PROJECT_ID: prj_V1a7hd39ABj3w5ARUOATF31XMWX9
      VERCEL_CLI_VERSION: 60.1.3
      VERCEL_TELEMETRY_DISABLED: 1
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Require current main and successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$RELEASE_SHA" = "$current_main"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and (.event == "push" or .event == "workflow_dispatch"))] | length')
          test "$runs" -gt 0

      - name: Check out verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install build tools without deploy credentials
        run: |
          npm ci
          npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Select isolated Kotlin deployment configuration
        run: |
          cp deploy/vercel.kotlin.json vercel.json
          mkdir -p .vercel
          node -e 'require("node:fs").writeFileSync(".vercel/project.json", JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}))'

      - name: Pull Kotlin project settings and public build configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::Set VERCEL_TOKEN in the kotlin-production GitHub environment'; exit 1; }
          vercel project inspect "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --non-interactive
          vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID"
          node scripts/deploy/prepare-kotlin.mjs

      - name: Build static frontend and business API for the verified source
        run: |
          npm run frontend:build
          backend/mvnw -f backend/api/pom.xml --batch-mode --no-transfer-progress -DskipTests package
          mkdir -p backend/api/target/deploy-jdk
          cp -a "$JAVA_HOME/." backend/api/target/deploy-jdk/
          cp backend/certs/supabase-ca.crt backend/api/target/supabase-ca.crt

      - name: Build service images and stage production without moving domains
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          vercel build --prod --yes --scope "$VERCEL_ORG_ID"
          deployment_url=$(vercel deploy --prebuilt --prod --skip-domain --yes --scope "$VERCEL_ORG_ID")
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staged frontend, API and database
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel curl "$DEPLOYMENT_URL/actuator/health" --scope "$VERCEL_ORG_ID" -- --silent --show-error --fail --max-time 90 > "$RUNNER_TEMP/kotlin-health.json"
          vercel curl "$DEPLOYMENT_URL/app-version.json" --scope "$VERCEL_ORG_ID" -- --silent --show-error --fail --max-time 60 > "$RUNNER_TEMP/frontend-version.json"
          HEALTH_FILE="$RUNNER_TEMP/kotlin-health.json" VERSION_FILE="$RUNNER_TEMP/frontend-version.json" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync(process.env.HEALTH_FILE, "utf8"));
            const remote = JSON.parse(readFileSync(process.env.VERSION_FILE, "utf8"));
            const build = JSON.parse(readFileSync("frontend/dist/app-version.json", "utf8"));
            if (health.status !== "UP" || remote.version !== build.version) process.exit(1);
          '
          vercel curl "$DEPLOYMENT_URL/login" --scope "$VERCEL_ORG_ID" -- --silent --show-error --fail --max-time 60 --output /dev/null

      - name: Publish the tested deployment if it is still current main
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          test "$RELEASE_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          vercel promote "$DEPLOYMENT_URL" --yes --scope "$VERCEL_ORG_ID"
          printf 'Published `%s` to https://forena-kotlin.vercel.app\n\nTested deployment: %s\n' "$RELEASE_SHA" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove pulled environment files
        if: always()
        run: rm -f .vercel/.env.*.local
