name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify Kotlin release credential and target boundaries
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py'

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Restore incremental Next compiler cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-24.19.0-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-24.19.0-${{ hashFiles('package-lock.json') }}-

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Calculate browser build inputs
        id: frontend-inputs
        run: python3 scripts/deploy/build_inputs.py frontend >> "$GITHUB_OUTPUT"

      - name: Restore unchanged browser build
        id: frontend-cache
        uses: actions/cache@v4
        with:
          path: frontend/dist
          key: frontend-${{ runner.os }}-${{ steps.frontend-inputs.outputs.fingerprint }}

      - name: Build the separate browser frontend
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        run: npm run frontend:build

      - name: Install Chromium for browser navigation checks
        run: npx playwright install --with-deps chromium

      - name: Verify browser navigation and session isolation
        shell: bash
        run: |
          set -euo pipefail
          npm run preview --workspace @forena/frontend -- --host 127.0.0.1 > "$RUNNER_TEMP/frontend-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 0.2
          done
          curl --silent --fail http://127.0.0.1:3000/ >/dev/null
          FORENA_BROWSER_BASE_URL=http://localhost:3000 node scripts/migration/browser-frontend-mock.mjs

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CLI_VERSION: 2.118.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: supabase db start

      - name: Run database security tests
        run: supabase test db

      - name: Generate database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          test -s /tmp/database.types.ts

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Spring authentication, Kotlin authorization and migrations
        run: backend/mvnw -f backend/pom.xml --batch-mode --no-transfer-progress verify

      - name: Verify packaged migration and runtime modes
        run: python3 backend/scripts/local-smoke.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/contract/package-lock.json

      - name: Verify Spring-generated OpenAPI and TypeScript types
        run: |
          npm ci --prefix backend/contract --ignore-scripts
          npm run check --prefix backend/contract

      - name: Verify real browser accounts, WebAuthn, OAuth and activity management
        run: |
          npm ci
          npm run frontend:build
          npx playwright install --with-deps chromium
          npm run preview --workspace @forena/frontend -- --port 3002 > "$RUNNER_TEMP/auth-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          FORENA_AUTH_BROWSER_TEST=true FORENA_M09_BROWSER_TEST=true backend/mvnw -f backend/pom.xml --batch-mode --no-transfer-progress '-Dtest=AuthTest,ApiTest#browser*' test

      - name: Retain verified migration JAR
        uses: actions/upload-artifact@v7
        with:
          name: forena-migration-jar-${{ github.sha }}
          path: backend/target/forena-api.jar
          retention-days: 3
          if-no-files-found: error

      - name: Retain API and architecture reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/openapi.json
            backend/target/surefire-reports/
            backend/target/spring-modulith-docs/
            backend/target/activity-management-browser.log
            backend/target/administration-browser.log
            frontend/.evidence/m09-*.png

  native-image:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Download verified migration JAR
        uses: actions/download-artifact@v8
        with:
          name: forena-migration-jar-${{ github.sha }}
          path: backend/target

      - name: Calculate backend build inputs
        id: backend-inputs
        run: python3 scripts/deploy/build_inputs.py backend >> "$GITHUB_OUTPUT"

      - name: Restore unchanged native image
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/forena-backend.tar.gz
            ${{ runner.temp }}/backend-image.json
          key: native-linux-amd64-v1-${{ steps.backend-inputs.outputs.epoch }}-${{ steps.backend-inputs.outputs.fingerprint }}

      - name: Load and verify cached image
        if: steps.native-cache.outputs.cache-hit == 'true'
        run: |
          docker load --input "$RUNNER_TEMP/forena-backend.tar.gz"
          docker image inspect forena-backend:ci > "$RUNNER_TEMP/backend-image-inspect.json"
          python3 scripts/deploy/use-backend-image.py verify-cache \
            "$RUNNER_TEMP/backend-image.json" "$RUNNER_TEMP/backend-image-inspect.json" "$GITHUB_SHA"

      - name: Build native container with Spring Boot buildpacks
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: >-
          backend/mvnw -f backend/pom.xml --batch-mode --no-transfer-progress
          -Pnative -DskipTests
          -Dspring-boot.build-image.imageName=forena-backend:ci
          -Dspring-boot.build-image.imagePlatform=linux/amd64
          -Dspring-boot.build-image.builder=paketobuildpacks/builder-noble-java-tiny@sha256:07b5e2d02f2e7dd26b6c7bf175c3381d496a4418e1bc8a8297e258e0c75ac696
          spring-boot:build-image

      - name: Set up browser verification for the native runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Build browser client and install Chromium
        run: |
          npm ci
          npm run frontend:build
          npx playwright install --with-deps chromium

      - name: Verify native Spring authentication against disposable PostgreSQL
        run: python3 backend/scripts/local-smoke.py --runtime-image forena-backend:ci --browser

      - name: Export tested backend image
        run: |
          docker save forena-backend:ci | gzip > "$RUNNER_TEMP/forena-backend.tar.gz"
          docker image inspect forena-backend:ci > "$RUNNER_TEMP/backend-image-inspect.json"
          python3 scripts/deploy/use-backend-image.py record \
            "$RUNNER_TEMP/backend-image.json" "$RUNNER_TEMP/backend-image-inspect.json" "$GITHUB_SHA"

      - name: Cache successfully tested native image
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/forena-backend.tar.gz
            ${{ runner.temp }}/backend-image.json
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Retain tested backend image
        uses: actions/upload-artifact@v7
        with:
          name: forena-backend-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forena-backend.tar.gz
            ${{ runner.temp }}/backend-image.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  # Keep the existing required check; every parallel job must succeed.
  verify:
    needs: [application, database, backend, native-image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          NATIVE_RESULT: ${{ needs.native-image.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$NATIVE_RESULT" = success
