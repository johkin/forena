name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CLI_VERSION: 2.118.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: supabase db start

      - name: Run database security tests
        run: supabase test db

      - name: Generate database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          test -s /tmp/database.types.ts

  kotlin-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Oracle JDK 26.0.2.1
        run: |
          scripts/probe/install-jdk.sh "$RUNNER_TEMP/forena-jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/forena-jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/forena-jdk/bin" >> "$GITHUB_PATH"

      - name: Verify Kotlin, schema, module structure and HTTP lifecycle
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify abrupt JVM death and durable recovery
        run: python3 scripts/probe/local-lifecycle.py

      - name: Retain test and generated architecture reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-probe-reports
          path: |
            backend/target/surefire-reports/
            backend/target/spring-modulith-docs/

  # Keep the existing required check; it must fail if either parallel job fails or skips.
  verify:
    needs: [application, database, kotlin-probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          KOTLIN_RESULT: ${{ needs.kotlin-probe.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$KOTLIN_RESULT" = success
