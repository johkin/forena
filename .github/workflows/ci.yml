name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify Kotlin release credential and target boundaries
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py'

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Build the separate browser frontend
        run: npm run frontend:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ckzrtxqjskosqzoitymc.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CLI_VERSION: 2.118.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: supabase db start

      - name: Run database security tests
        run: supabase test db

      - name: Generate database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          test -s /tmp/database.types.ts

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify business API, JWT, Kotlin authorization and migrations
        run: backend/mvnw -f backend/api/pom.xml --batch-mode --no-transfer-progress verify

      - name: Verify packaged migration and runtime modes
        run: python3 backend/api/scripts/local-smoke.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/contract/package-lock.json

      - name: Verify Spring-generated OpenAPI and TypeScript types
        run: |
          npm ci --prefix backend/api/contract --ignore-scripts
          npm run check --prefix backend/api/contract

      - name: Retain API and architecture reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/api/target/openapi.json
            backend/api/target/surefire-reports/
            backend/api/target/spring-modulith-docs/

  native-image:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build native container with Spring Boot buildpacks
        run: >-
          backend/mvnw -f backend/api/pom.xml --batch-mode --no-transfer-progress
          -Pnative -DskipTests
          -Dspring-boot.build-image.imageName=forena-backend:ci
          spring-boot:build-image

      - name: Verify the native buildpack image against disposable PostgreSQL and Auth keys
        run: python3 backend/api/scripts/local-smoke.py --runtime-image forena-backend:ci

      - name: Export tested backend image
        run: |
          docker save forena-backend:ci | gzip > "$RUNNER_TEMP/forena-backend.tar.gz"
          docker image inspect forena-backend:ci > "$RUNNER_TEMP/backend-image-inspect.json"
          python3 - <<'PYIMAGE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          image = json.loads((root / 'backend-image-inspect.json').read_text())[0]
          (root / 'backend-image.json').write_text(json.dumps({'sourceCommit': os.environ['GITHUB_SHA'], 'imageId': image['Id']}))
          PYIMAGE

      - name: Retain tested backend image
        uses: actions/upload-artifact@v7
        with:
          name: forena-backend-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forena-backend.tar.gz
            ${{ runner.temp }}/backend-image.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  # Keep the existing required check; every parallel job must succeed.
  verify:
    needs: [application, database, backend, native-image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          NATIVE_RESULT: ${{ needs.native-image.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$NATIVE_RESULT" = success
