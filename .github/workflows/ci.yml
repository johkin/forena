name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify Kotlin release credential and target boundaries
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py'

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Build the separate browser frontend
        run: npm run frontend:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ckzrtxqjskosqzoitymc.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CLI_VERSION: 2.118.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: supabase db start

      - name: Run database security tests
        run: supabase test db

      - name: Generate database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          test -s /tmp/database.types.ts

  kotlin-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Oracle JDK 26.0.2.1
        run: |
          scripts/probe/install-jdk.sh "$RUNNER_TEMP/forena-jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/forena-jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/forena-jdk/bin" >> "$GITHUB_PATH"

      - name: Verify Kotlin, schema, module structure and HTTP lifecycle
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify abrupt JVM death and concurrent durable recovery
        run: python3 scripts/probe/local-lifecycle.py --concurrent-recovery --scheduled-crash --registry-backlog 10000

      - name: Verify local capacity, pool exhaustion and registry timeouts
        run: python3 scripts/probe/local-capacity.py --quick --out backend/target/m22e-capacity-ci.json

      - name: Verify bounded recovery cadence and deferred-prefix fairness
        run: python3 scripts/probe/local-capacity.py --quick --recovery-cadence --out backend/target/m22f-cadence-ci.json

      - name: Verify cost calculation
        run: |
          python3 scripts/probe/cost-model.py --out /tmp/m22e-costs.json
          diff -u docs/migration/evidence/m22e-costs.json /tmp/m22e-costs.json

      - name: Verify Data API isolation evidence and rejection checks
        run: |
          python3 scripts/probe/isolation-check.py --verify-evidence docs/migration/evidence/m22-isolation.json
          python3 -m unittest discover -s scripts/probe -p 'test_isolation_check.py'

      - name: Retain test and generated architecture reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-probe-reports
          path: |
            backend/target/m22f-cadence-ci.json
            backend/target/m22e-capacity-ci.json
            backend/target/surefire-reports/
            backend/target/spring-modulith-docs/

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify business API, JWT, Kotlin authorization and migrations
        run: backend/mvnw -f backend/api/pom.xml --batch-mode --no-transfer-progress verify

      - name: Verify packaged migration and runtime modes
        run: python3 backend/api/scripts/local-smoke.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/contract/package-lock.json

      - name: Verify Spring-generated OpenAPI and TypeScript types
        run: |
          npm ci --prefix backend/api/contract --ignore-scripts
          npm run check --prefix backend/api/contract

      - name: Retain API and architecture reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/api/target/openapi.json
            backend/api/target/surefire-reports/
            backend/api/target/spring-modulith-docs/

  # Keep the existing required check; every parallel job must succeed.
  verify:
    needs: [application, database, kotlin-probe, backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          KOTLIN_RESULT: ${{ needs.kotlin-probe.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$KOTLIN_RESULT" = success
          test "$BACKEND_RESULT" = success
