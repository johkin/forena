name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Forks do not receive secrets. Only trusted collaborators may run commands.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.sender.type != 'Bot' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
    steps:
      - name: Check OpenAI configuration
        shell: bash
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo "::error::Add the OPENAI_KEY repository secret under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # PR-Agent reads the diff via GitHub's API; no PR code is checked out.
      - name: Review with PR-Agent
        uses: docker://pragent/pr-agent:0.49.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "gpt-6.1-sol"
          config.fallback_models: '["gpt-6-luna"]'
          config.response_language: "sv-SE"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
          github_action_config.push_trigger_ignore_bot_commits: "false"
