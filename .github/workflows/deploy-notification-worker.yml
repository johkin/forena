name: Deploy notification worker

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/notification-worker/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-notification-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-notification-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Deploy notification worker
        run: supabase functions deploy notification-worker --project-ref "$SUPABASE_PROJECT_ID"
