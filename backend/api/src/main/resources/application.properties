spring.application.name=forena-api
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.datasource.url=${FORENA_JDBC_URL}
spring.datasource.username=${FORENA_DB_USERNAME:forena_api_runtime}
spring.datasource.password=${FORENA_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET search_path TO forena,pg_catalog
spring.liquibase.enabled=${FORENA_MIGRATE:false}
spring.liquibase.change-log=classpath:db/changelog.xml
spring.liquibase.default-schema=forena
spring.liquibase.user=${FORENA_MIGRATION_USERNAME:forena_api_owner}
spring.liquibase.password=${FORENA_MIGRATION_PASSWORD:}
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=false
forena.auth.issuer=${FORENA_AUTH_ISSUER}
forena.auth.jwks-uri=${FORENA_AUTH_JWKS_URI}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
