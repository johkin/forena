name: forena-local
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: forena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-only
    ports:
      - "127.0.0.1:${FORENA_LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
      - ./scripts/local-credentials.sql:/docker-entrypoint-initdb.d/002-local-credentials.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forena"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      # Keep explicit owner/runtime credentials; never auto-connect as postgres.
      org.springframework.boot.ignore: "true"
volumes:
  postgres-data:
