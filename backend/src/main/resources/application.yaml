spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  application:
    name: forena-api
  lifecycle:
    timeout-per-shutdown-phase: 5s
  datasource:
    url: "${FORENA_JDBC_URL}"
    username: "${FORENA_DB_USERNAME:forena_api_runtime}"
    password: "${FORENA_DB_PASSWORD}"
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 5000
      connection-init-sql: SET search_path TO forena,pg_catalog
  liquibase:
    enabled: "${FORENA_MIGRATE:true}"
    change-log: classpath:db/changelog.xml
    default-schema: forena
    user: "${FORENA_MIGRATION_USERNAME:forena_api_owner}"
    password: "${FORENA_MIGRATION_PASSWORD:}"
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: false

server:
  port: "${PORT:8080}"
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

forena:
  web-session:
    enabled: "${FORENA_WEB_SESSION_ENABLED:false}"
    origin: "${FORENA_WEB_ORIGIN:}"
    key: "${FORENA_WEB_SESSION_KEY:}"
    secure: "${FORENA_WEB_SESSION_SECURE:true}"
    trust-vercel-proxy: "${FORENA_TRUST_VERCEL_PROXY:false}"
    max-seconds: "${FORENA_WEB_SESSION_MAX_SECONDS:28800}"
    idle-seconds: "${FORENA_WEB_SESSION_IDLE_SECONDS:1800}"
  auth:
    issuer: "${FORENA_AUTH_ISSUER:}"
    jwks-uri: "${FORENA_AUTH_JWKS_URI:}"
    publishable-key: "${FORENA_AUTH_PUBLISHABLE_KEY:}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  packages-to-scan: se.forena.api.activities,se.forena.api.identity
  paths-to-match: /api/**
  writer-with-order-by-keys: true
  override-with-generic-response: false
