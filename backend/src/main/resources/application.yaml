spring:
  docker:
    compose:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  application:
    name: forena-api
  lifecycle:
    timeout-per-shutdown-phase: 5s
  datasource:
    url: "${FORENA_JDBC_URL}"
    username: "${FORENA_DB_USERNAME:forena_api_runtime}"
    password: "${FORENA_DB_PASSWORD}"
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 5000
      connection-init-sql: SET search_path TO forena,pg_catalog
  liquibase:
    enabled: "${FORENA_MIGRATE:true}"
    change-log: classpath:db/changelog.xml
    default-schema: forena
    user: "${FORENA_MIGRATION_USERNAME:forena_api_owner}"
    password: "${FORENA_MIGRATION_PASSWORD:}"
  modulith:
    events:
      jdbc:
        schema: forena
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: false

server:
  port: "${PORT:8080}"
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

forena:
  notifications:
    enabled: "${FORENA_NOTIFICATIONS_ENABLED:false}"
    worker-token: "${FORENA_NOTIFICATION_WORKER_TOKEN:}"
    test-recipients: "${FORENA_NOTIFICATION_TEST_RECIPIENTS:}"
  administration:
    initial-system-admin-email: "${FORENA_INITIAL_SYSTEM_ADMIN_EMAIL:}"
  web-session:
    enabled: "${FORENA_WEB_SESSION_ENABLED:true}"
    origin: "${FORENA_WEB_ORIGIN:}"
    key: "${FORENA_WEB_SESSION_KEY:}"
    secure: "${FORENA_WEB_SESSION_SECURE:true}"
    trust-vercel-proxy: "${FORENA_TRUST_VERCEL_PROXY:false}"
    max-seconds: "${FORENA_WEB_SESSION_MAX_SECONDS:86400}"
    idle-seconds: "${FORENA_WEB_SESSION_IDLE_SECONDS:86400}"

  email:
    resend-api-key: "${RESEND_API_KEY:}"
    from: "${RESEND_FROM_EMAIL:}"

  authentication:
    rp-id: "${FORENA_PASSKEY_RP_ID:}"
    client-id: "${FORENA_OAUTH_CLIENT_ID:}"
    client-redirect: "${FORENA_OAUTH_CLIENT_REDIRECT:}"
    client-secret: "${FORENA_OAUTH_CLIENT_SECRET:}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  packages-to-scan: se.forena.api.activities,se.forena.api.identity,se.forena.api.administration
  paths-to-match: /api/**
  writer-with-order-by-keys: true
  override-with-generic-response: false
