spring.application.name=forena-kotlin-probe
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.datasource.url=${PROBE_JDBC_URL}
spring.datasource.username=${PROBE_DB_USERNAME:forena_probe_runtime}
spring.datasource.password=${PROBE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET search_path TO forena_probe
spring.liquibase.enabled=${PROBE_MIGRATE:false}
spring.liquibase.change-log=classpath:db/changelog.xml
spring.liquibase.default-schema=forena_probe
spring.liquibase.user=${PROBE_MIGRATION_USERNAME:${PROBE_DB_USERNAME:forena_probe_runtime}}
spring.liquibase.password=${PROBE_MIGRATION_PASSWORD:${PROBE_DB_PASSWORD}}
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=false
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=2
spring.task.execution.pool.queue-capacity=20
probe.token=${PROBE_TOKEN}
probe.allow-crash=${PROBE_ALLOW_CRASH:false}
probe.worker.token=${PROBE_WORKER_TOKEN:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
