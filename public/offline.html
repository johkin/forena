<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f35">
  <title>Du är offline · Förena</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; color: #173f35; background: #f7f5ed; }
    main { width: min(100%, 420px); padding: 24px; background: #fffefa; border: 1px solid #dfe4df; border-radius: 18px; overflow-wrap: anywhere; }
    h1 { font-size: 26px; }
    p { line-height: 1.5; }
    a { display: inline-block; padding: 14px 18px; border-radius: 10px; background: #173f35; color: white; text-decoration: none; }
    a:focus-visible { outline: 3px solid #557069; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>Förena</p>
    <h1>Du är offline</h1>
    <p>Anslut till internet för att se dina aktiviteter och kallelser.</p>
    <a href="/">Försök igen</a>
  </main>
</body>
</html>
